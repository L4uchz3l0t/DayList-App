# Einstellungen für die Veröffentlichung auf Netlify (Phase 6).
# Netlify liest diese Datei automatisch, im Netlify-Konto muss nichts eingetragen werden.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Der Service Worker darf nie lange zwischengespeichert werden, sonst kommen Updates nicht an
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
