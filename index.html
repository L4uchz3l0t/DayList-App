<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Die App bringt ihr eigenes dunkles Design mit, der Browser soll nichts selbst abdunkeln -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dde2da" />
    <script>
      // Gewähltes Design sofort setzen, bevor die Seite gezeichnet wird (kein kurzes Aufblitzen)
      try {
        var stored = localStorage.getItem('theme') || 'light'
        var dark = stored === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : stored === 'dark'
        var design = localStorage.getItem('design') || 'block'
        document.documentElement.dataset.theme = stored
        document.documentElement.dataset.design = design
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
        // Ungefähre Farbe der Statusleiste; die App setzt danach die genaue (design.ts)
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1a21' : '#dde2da'
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="DayList" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DayList</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
